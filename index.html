<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anim'Addict - Nakama App</title>
    
    <!-- Script Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.min.js"></script>

    <style>
        :root {
            --bg-ocean: #0b3075;
            --card-wood: #2a1a0e;
            --gold: #f8de3c;
            --red-flag: #c8472c;
            --paper: #f4e8c1;
            --text-dark: #1f140e;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-ocean);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background-color: var(--card-wood);
            border-bottom: 4px solid var(--gold);
            padding: 15px 0;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-bar {
            width: 90%;
            max-width: 400px;
            background-color: var(--card-wood);
            border: 1px solid var(--gold);
            border-radius: 8px;
            padding: 10px 15px;
            margin: 15px 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .badge-status {
            background-color: var(--red-flag);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        main {
            width: 90%;
            max-width: 400px;
            flex-grow: 1;
            margin-bottom: 30px;
        }

        .section-title {
            color: var(--gold);
            border-bottom: 2px dashed var(--gold);
            padding-bottom: 5px;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        /* Bouton d'action principal */
        .btn-action {
            width: 100%;
            background-color: var(--gold);
            color: var(--card-wood);
            border: 2px solid var(--card-wood);
            padding: 12px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        /* Formulaire de rédaction */
        .admin-form {
            display: none; /* Masqué par défaut */
            background-color: var(--card-wood);
            border: 2px solid var(--gold);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .admin-form label {
            display: block;
            font-size: 0.85rem;
            color: var(--gold);
            margin-bottom: 4px;
        }

        .admin-form input, .admin-form textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-family: inherit;
        }

        .btn-submit {
            background-color: var(--red-flag);
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Cartes Chroniques */
        .chronique-card {
            background-color: var(--paper);
            color: var(--text-dark);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            border: 3px solid #8c6d46;
            box-shadow: 0px 5px 12px rgba(0,0,0,0.4);
        }

        .chronique-card h3 {
            margin: 0 0 8px 0;
            color: var(--red-flag);
            font-size: 1.1rem;
        }

        .chronique-meta {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .chronique-content {
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .loading-text {
            text-align: center;
            color: var(--gold);
            font-style: italic;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏴‍☠️ ANIM'ADDICT</h1>
    </header>

    <!-- Barre de Statut avec Jauge Supabase -->
    <div class="status-bar">
        <div class="status-header">
            <div><strong style="color: var(--gold);">Nakama :</strong> Staff</div>
            <div class="badge-status">Base active ⚡</div>
        </div>
        
        <!-- Barre de progression -->
        <div style="width: 100%; margin-top: 2px;">
            <div style="display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 3px; color: #d0d0d0;">
                <span>Stockage Supabase</span>
                <span id="db-usage-text">Calcul...</span>
            </div>
            <div style="width: 100%; background: #1a1a1a; height: 8px; border-radius: 4px; overflow: hidden; border: 1px solid var(--gold);">
                <div id="db-bar" style="width: 1%; height: 100%; background: #2ecc71; transition: width 0.5s;"></div>
            </div>
        </div>
    </div>

    <main>
        <!-- Bouton pour afficher/masquer le formulaire -->
        <button class="btn-action" onclick="toggleForm()">✍️ Rédiger une chronique</button>

        <!-- Formulaire d'envoi -->
        <div id="form-container" class="admin-form">
            <h3 style="margin-top:0; color: var(--gold);">Nouvelle Chronique</h3>
            <label for="titre">Titre</label>
            <input type="text" id="titre" placeholder="Ex: Réunion cosplay..." required>

            <label for="auteur">Auteur / Staff</label>
            <input type="text" id="auteur" placeholder="Ex: Capitaine" required>

            <label for="contenu">Message</label>
            <textarea id="contenu" rows="4" placeholder="Écris ton article ici..." required></textarea>

            <button class="btn-submit" onclick="publierChronique()">Publier sur l'application 🚀</button>
        </div>

        <h2 class="section-title">📜 Chroniques des Nakama'Ohi</h2>

        <div id="chroniques-container">
            <p class="loading-text">Chargement du journal depuis la base...</p>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://prbzqxjepnktarocgcgu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_WHKV9gLWmts_3FmKL_6sjw_ycC9dvOa';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Afficher/masquer le formulaire
        function toggleForm() {
            const form = document.getElementById('form-container');
            form.style.display = form.style.display === 'block' ? 'none' : 'block';
        }

        // Calculer l'espace utilisé dans Supabase
        function mettreAJourJauge(nombreArticles) {
    const tailleBaseFixe = 24.55; // Poids initial de la base Supabase (Mo)
    const tailleArticlesKo = nombreArticles * 0.5; // ~0.5 Ko par chronique
    const tailleTotaleMo = tailleBaseFixe + (tailleArticlesKo / 1024);
    const maxMo = 500;
    
    let pourcentage = (tailleTotaleMo / maxMo) * 100;

    const dbText = document.getElementById('db-usage-text');
    const dbBar = document.getElementById('db-bar');

    if (dbText && dbBar) {
        dbText.innerText = `${tailleTotaleMo.toFixed(2)} Mo / 500 Mo (${nombreArticles} articles)`;
        dbBar.style.width = `${pourcentage}%`;
    }
}


        // Charger les chroniques depuis la base
        async function chargerChroniques() {
            const container = document.getElementById('chroniques-container');

            try {
                const { data, error } = await supabase
                    .from('chroniques')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    container.innerHTML = `<p style="color: #ff6b6b; text-align:center;">⚠️ Erreur : ${error.message}</p>`;
                    return;
                }

                // Mettre à jour la jauge avec le nombre total d'articles
                mettreAJourJauge(data ? data.length : 0);

                if (!data || data.length === 0) {
                    container.innerHTML = `<p style="text-align:center; color: #fff;">Aucune chronique publiée pour le moment.</p>`;
                    return;
                }

                container.innerHTML = '';
                data.forEach(article => {
                    const dateArticle = article.created_at 
                        ? new Date(article.created_at).toLocaleDateString('fr-FR')
                        : 'Récemment';
                    
                    const card = document.createElement('article');
                    card.className = 'chronique-card';
                    card.innerHTML = `
                        <h3>${article.titre || article.Titre || 'Sans titre'}</h3>
                        <div class="chronique-meta">
                            <span>Par : <strong>${article.auteur || article.Auteur || 'Staff'}</strong></span>
                            <span>${dateArticle}</span>
                        </div>
                        <div class="chronique-content">
                            ${article.contenu || article.Contenu || ''}
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                container.innerHTML = `<p style="color: #ff6b6b; text-align:center;">⚠️ Erreur de connexion.</p>`;
            }
        }

        // Publier une nouvelle chronique
        async function publierChronique() {
            const titre = document.getElementById('titre').value.trim();
            const auteur = document.getElementById('auteur').value.trim();
            const contenu = document.getElementById('contenu').value.trim();

            if (!titre || !auteur || !contenu) {
                alert('Merci de remplir tous les champs !');
                return;
            }

            // Insertion dans la table Supabase
            const { error } = await supabase
                .from('chroniques')
                .insert([{ titre: titre, auteur: auteur, contenu: contenu }]);

            if (error) {
                alert('Erreur lors de la publication : ' + error.message);
                console.error(error);
            } else {
                alert('Chronique publiée avec succès ! 🎉');
                document.getElementById('titre').value = '';
                document.getElementById('auteur').value = '';
                document.getElementById('contenu').value = '';
                toggleForm();
                chargerChroniques();
            }
        }

        // Lancement au démarrage
        chargerChroniques();
    </script>
</body>
</html>
